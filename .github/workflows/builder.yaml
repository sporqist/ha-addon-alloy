# Builds the add-on image on every PR and publishes it to GHCR on merge to main.
# Adapted from home-assistant/apps-example (the official blueprint after the
# April 2026 move from the legacy builder container to BuildKit).
name: Builder

env:
  MONITORED_FILES: "config.yaml Dockerfile apparmor.txt rootfs"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_apps: ${{ steps.filter.outputs.changed_apps }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@58bff37c8947f690ace498be413a9b78d6f30f93 # master 2026-09

      - name: Filter changed apps
        id: filter
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
        run: |
          changed_apps=()

          # If a workflow file or the test harness changed, rebuild everything
          if [[ "${CHANGED_FILES}" =~ \.github/(workflows/(builder|build-app)\.yaml|scripts/) ]]; then
            changed_apps=(${APPS})
          else
            for app in ${APPS}; do
              for file in ${MONITORED_FILES}; do
                if [[ "${CHANGED_FILES}" =~ ${app}/${file} ]]; then
                  changed_apps+=("${app}")
                  break
                fi
              done
            done
          fi

          # On a pull request, every app is built regardless of the diff (see build-app)
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            changed_apps=(${APPS})
          fi

          if [[ ${#changed_apps[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_apps=$(jq -nc '$ARGS.positional' --args "${changed_apps[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # FAIL CLOSED ON PULL REQUESTS: every PR builds and runs the e2e gate, whatever
  # it touched. The path filter only trims pushes to main (the publish path),
  # where the image was already gated on the PR. A required check that passes
  # because the gate was skipped is the same as no gate.
  build-app:
    name: Build ${{ matrix.app }}
    needs: init
    if: github.event_name == 'pull_request' || needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit

  # THE ONE CHECK BRANCH PROTECTION REQUIRES. It always reports, even when the
  # build was skipped because no add-on file changed: a required check that is
  # missing blocks the PR forever, and a required check that only sometimes
  # runs is the same thing. Fails on any failed or cancelled build, passes on
  # success or skip.
  ci-ok:
    name: CI OK
    needs: [init, build-app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        env:
          INIT: ${{ needs.init.result }}
          BUILD: ${{ needs.build-app.result }}
        run: |
          echo "init=${INIT} build=${BUILD}"
          [[ "${INIT}" == "success" ]] || { echo "init failed"; exit 1; }
          # skipped is acceptable only on a push (the PR already ran the gate)
          case "${BUILD}" in
            success) exit 0 ;;
            skipped) [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]] && exit 0; echo "gate skipped on a PR"; exit 1 ;;
            *) echo "build ${BUILD}"; exit 1 ;;
          esac
