# Builds the add-on image on every PR and publishes it to GHCR on merge to main.
# Adapted from home-assistant/apps-example (the official blueprint after the
# April 2026 move from the legacy builder container to BuildKit).
name: Builder

env:
  MONITORED_FILES: "config.yaml Dockerfile apparmor.txt rootfs"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_apps: ${{ steps.filter.outputs.changed_apps }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@v47

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Filter changed apps
        id: filter
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
        run: |
          changed_apps=()

          # If a workflow file or the test harness changed, rebuild everything
          if [[ "${CHANGED_FILES}" =~ \.github/(workflows/(builder|build-app)\.yaml|scripts/) ]]; then
            changed_apps=(${APPS})
          else
            for app in ${APPS}; do
              for file in ${MONITORED_FILES}; do
                if [[ "${CHANGED_FILES}" =~ ${app}/${file} ]]; then
                  changed_apps+=("${app}")
                  break
                fi
              done
            done
          fi

          if [[ ${#changed_apps[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_apps=$(jq -nc '$ARGS.positional' --args "${changed_apps[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Build ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit

  # THE ONE CHECK BRANCH PROTECTION REQUIRES. It always reports, even when the
  # build was skipped because no add-on file changed: a required check that is
  # missing blocks the PR forever, and a required check that only sometimes
  # runs is the same thing. Fails on any failed or cancelled build, passes on
  # success or skip.
  ci-ok:
    name: CI OK
    needs: [init, build-app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        env:
          INIT: ${{ needs.init.result }}
          BUILD: ${{ needs.build-app.result }}
        run: |
          echo "init=${INIT} build=${BUILD}"
          [[ "${INIT}" == "success" ]] || { echo "init failed"; exit 1; }
          case "${BUILD}" in
            success|skipped) exit 0 ;;
            *) echo "build ${BUILD}"; exit 1 ;;
          esac
