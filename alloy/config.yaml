# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Alloy
# <alloy version>.<add-on revision>. The first three components are the bundled
# Alloy version and the published image tag must carry them; the fourth is
# bumped for add-on-only changes, because Home Assistant offers an update only
# when this string changes. Renovate writes the plain Alloy release here (rev
# back to 0, implicitly), into the Dockerfile's ALLOY_VERSION and into
# CHANGELOG.md's top section, all in one pull request. Home Assistant shows
# that section as the release notes, so a version without one is a bug the
# gate fails on. Each version is published once and its tag never changes:
# every change to the image, the profile or the options needs a new revision
# (the gate says which), and on a Renovate base image bump the revision bot
# (.github/workflows/revision.yaml) writes it.
version: "1.21.1"
slug: alloy
description: >-
  Ship the Home Assistant OS systemd journal to Loki with Grafana Alloy.
  Replacement for the abandoned Promtail add-on.
url: https://github.com/sporqist/ha-addon-alloy
arch:
  - aarch64
  - amd64
# Pre-built by CI (home-assistant/builder actions) and pulled, never compiled
# on the Home Assistant host.
image: ghcr.io/sporqist/ha-addon-alloy
init: false
startup: services
# The one privilege this add-on needs: the host journal, read-only.
journald: true
# Alloy's debug UI is unauthenticated. It is NOT published on the host by
# default; set a host port in the add-on's Network settings only while
# debugging. Health is checked by the image's HEALTHCHECK against /-/ready
# inside the container, so the mapping is not needed for that.
ports:
  12345/tcp: null
ports_description:
  12345/tcp: "Alloy debug UI (unauthenticated - leave unmapped unless debugging)"
# AppArmor is on by default; the custom profile is apparmor.txt next to this
# file. Upstream shipped `apparmor: false`, which is the point of this fork.
# Defaults are faithful and minimal: the journal as journald recorded it.
# Everything that transforms it is opt-in. See DOCS.md for each option.
# No loki_url default: localhost in here is the add-on itself, where no Loki
# answers, and the Supervisor refuses to start an add-on whose required
# option is unset - which is the right moment to ask for it.
options:
  log_level: info
  job: systemd-journal
  stream_labels:
    - hostname
    - unit
    - level
  structured_metadata: false
  level_from_message: false
  # Every optional key is listed here with an empty value ON PURPOSE: the
  # configuration form shows an optional field only if the key is present in
  # options (frontend: supervisor-app-config.ts, `entry.name in options ||
  # entry.required`); otherwise it hides behind "Show unused optional
  # configuration options". An empty string is valid for str/password
  # types. It is NOT valid for the url type (vol.Url rejects ""), which is why
  # the two metrics URLs are typed str below and checked by the generator.
  loki_username: ""
  loki_password: ""
  loki_bearer_token: ""
  loki_tenant_id: ""
  metrics_enabled: false
  metrics_url: ""
  metrics_token: ""
  metrics_remote_write_url: ""
  metrics_remote_write_user: ""
  metrics_remote_write_password: ""
  metrics_instance: ""
  metrics_interval: ""
  metrics_job: ""
  raw_config: false
  additional_config: ""
schema:
  loki_url: url
  log_level: "list(debug|info|warn|error)"
  job: str
  stream_labels:
    - "list(hostname|unit|level|syslog_identifier|container_name|transport|priority)"
  structured_metadata: bool
  level_from_message: bool
  # Loki authentication: basic auth OR a bearer token (the generator refuses
  # both), and the X-Scope-OrgID tenant for a multi-tenant Loki.
  loki_username: "str?"
  loki_password: "password?"
  loki_bearer_token: "password?"
  loki_tenant_id: "str?"
  # Optional metrics scrape (Home Assistant's /api/prometheus by default),
  # remote-written to a Prometheus. Nothing is read unless metrics_enabled.
  metrics_enabled: bool
  metrics_url: "str?"
  metrics_token: "password?"
  metrics_remote_write_url: "str?"
  metrics_remote_write_user: "str?"
  metrics_remote_write_password: "password?"
  metrics_instance: "str?"
  metrics_interval: "str?"
  metrics_job: "str?"
  # raw_config: additional_config IS the configuration; every other option
  # except log_level is ignored. The expert's exit from the generated pipeline.
  raw_config: bool
  additional_config: "str?"
stage: experimental
